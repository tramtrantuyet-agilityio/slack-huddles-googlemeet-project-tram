<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Directories · People</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:flex;background:var(--sb);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <div style="width:54px;height:900px;flex:none;">
    <dc-import name="Rail" active="home" hint-size="54px,900px"></dc-import>
  </div>
  <div style="width:280px;height:900px;flex:none;">
    <dc-import name="SidePanel" active="directories" hint-size="280px,900px"></dc-import>
  </div>
  <section style="width:1106px;height:900px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sf);border-left:1px solid var(--ru);border-top-left-radius:10px;overflow:hidden;">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ru);min-height:52px;box-sizing:border-box;">
      <h1 style="margin:0;font-size:17px;font-weight:700;">Directories</h1>
      <a href="Main.dc.html" aria-label="Close" style="width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink);text-decoration:none;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    </header>
    <nav aria-label="Directories" style="display:flex;gap:4px;padding:8px 20px 0;border-bottom:1px solid var(--ru);">
      <a href="People.dc.html" style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid var(--ac);color:var(--ink);font-weight:600;text-decoration:none;">People</a>
      <a href="Channels.dc.html" style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;text-decoration:none;">Channels</a>
      <span style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;">External</span>
      <span style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;">Invitations</span>
    </nav>
    <div style="flex:1;min-height:0;overflow:hidden;">
      <div style="padding:18px 24px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;">
        <div style="display:flex;gap:10px;align-items:center;">
          <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;box-sizing:border-box;border:1px solid var(--ru);border-radius:10px;background:var(--sf);color:var(--mu);"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>Search by name, title or email</div>
          <button type="button" style="height:44px;padding:0 16px;border:0;border-radius:6px;background:var(--ac);color:var(--aci);font:600 15px var(--font);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Invite people</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          <span style="height:32px;padding:0 12px;border:1px solid var(--ru);border-radius:999px;background:var(--sf);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">Title <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          <span style="height:32px;padding:0 12px;border:1px solid var(--ru);border-radius:999px;background:var(--sf);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">Location <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          <span style="height:32px;padding:0 10px 0 12px;border:1px solid var(--ru);border-radius:999px;background:var(--sf);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px;">More <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          <span style="flex:1;"></span>
          <span style="height:32px;padding:0 12px;border-radius:999px;color:var(--mu);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">Most relevant <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        </div>
        <p style="margin:0;font-size:13px;color:var(--mu);">5 people</p>
        <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;">
          <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
            <li>
              <a href="Profile.dc.html" style="display:grid;gap:2px;padding:0 0 12px;border:1px solid var(--ru);border-radius:12px;background:var(--sf);overflow:hidden;text-decoration:none;color:var(--ink);">
                <span style="display:grid;place-items:center;aspect-ratio:1;font-size:41px;font-weight:700;color:#fff;background:{{p.avatar}};" aria-hidden="true">{{p.ini}}</span>
                <span style="display:flex;align-items:center;gap:6px;min-width:0;padding:9px 12px 0;font-weight:700;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{p.name}}</span><span style="flex:none;width:9px;height:9px;border-radius:50%;box-sizing:border-box;border:2px solid {{p.dot}};background:{{p.dotFill}};" role="img" aria-label="{{p.presence}}"></span></span>
                <span style="min-height:1.4em;padding:0 12px;color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{p.title}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    const list = [
      { name: 'Alice Nguyễn', ini: 'AN', hue: 262, title: 'Product Manager', active: true },
      { name: 'Bob Trần', ini: 'BT', hue: 215, title: 'Backend Engineer', active: true },
      { name: 'Chi Lê', ini: 'CL', hue: 335, title: 'QA Lead', active: false },
      { name: 'Dũng Phạm', ini: 'DP', hue: 22, title: 'DevOps Engineer', active: true },
      { name: 'Hà Võ', ini: 'HV', hue: 285, title: 'Product Designer', active: false },
    ];
    const people = list.map((p) => ({
      ...p,
      avatar: 'hsl(' + p.hue + ' 45% 42%)',
      presence: p.active ? 'Active' : 'Away',
      dot: p.active ? '#5DD3A0' : 'var(--mu)',
      dotFill: p.active ? '#5DD3A0' : 'transparent',
    }));
    return { vars: common + (dark ? darkT : lightT), people };
  }
}
</script>
</body>
</html>
