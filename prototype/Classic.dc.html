<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Classic layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:flex;background:var(--sb);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <!-- Classic layout: a column of workspace tiles instead of the icon rail -->
  <nav aria-label="Workspaces" style="width:54px;height:900px;flex:none;box-sizing:border-box;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;">
    <button type="button" aria-label="Acme · Switch workspace" style="width:36px;height:36px;border:0;border-radius:9px;background:#3C3E7A;color:#fff;font:700 13px var(--font);box-shadow:0 0 0 2px var(--rail),0 0 0 4px rgba(217,218,240,.7);">AC</button>
    <button type="button" aria-label="Create a workspace" style="width:36px;height:36px;border:0;border-radius:9px;background:rgba(217,218,240,.18);color:var(--rail-ink);display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    <div style="flex:1;"></div>
    <button type="button" aria-label="Switch to light mode" style="width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--rail-ink);display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
    <a href="Profile.dc.html" aria-label="Alice Nguyễn" style="width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:hsl(262 45% 42%);text-decoration:none;">AN</a>
  </nav>
  <div style="width:280px;height:900px;flex:none;">
    <dc-import name="SidePanel" active="general" layout="classic" hint-size="280px,900px"></dc-import>
  </div>
  <div style="width:1106px;height:900px;flex:none;">
    <dc-import name="Channel" w="1106" compact="no" hint-size="1106px,900px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    return { vars: common + (dark ? darkT : lightT) };
  }
}
</script>
</body>
</html>
