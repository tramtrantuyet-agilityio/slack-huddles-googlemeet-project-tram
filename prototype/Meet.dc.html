<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Meet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- The call view is always dark in Toki (its own --call-* tokens), whatever the theme. -->
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:grid;grid-template-rows:1fr auto;background:#0E0E18;color:#EEEEF6;font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <div style="display:flex;min-height:0;padding:16px 16px 0;gap:16px;">
    <div style="position:relative;flex:1;min-width:0;display:grid;">
      <div style="width:100%;height:100%;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
          <div style="position:relative;background:#1C1C2C;border-radius:14px;overflow:hidden;display:grid;place-items:center;min-height:0;outline:3px solid {{t.ring}};outline-offset:-3px;">
            <span style="width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:41px;font-weight:600;color:#fff;background:#3C3E7A;letter-spacing:.02em;" aria-hidden="true">{{t.ini}}</span>
            <span style="position:absolute;left:10px;bottom:8px;font-size:13.6px;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{t.name}}</span>
            <span style="position:absolute;right:10px;top:8px;display:flex;gap:4px;color:#EEEEF6;">
              <sc-if value="{{t.muted}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Muted"><path d="M12 19v3"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M16.95 16.95A7 7 0 0 1 5 12v-2"/><path d="M18.89 13.23A7 7 0 0 0 19 12v-2"/><path d="m2 2 20 20"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/></svg>
              </sc-if>
              <sc-if value="{{t.hand}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#E8B45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Hand raised"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
              </sc-if>
            </span>
          </div>
        </sc-for>
      </div>
      <!-- Captions -->
      <div style="position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;width:min(820px,94%);box-sizing:border-box;background:rgba(0,0,0,.72);border-radius:10px;padding:8px 14px;display:grid;gap:4px;font-size:17px;">
        <p style="margin:0;line-height:1.4;"><b style="color:#B9BBFA;font-weight:600;">Bob Trần</b> Mình sẽ đẩy bản beta lên tối nay, mọi người kiểm thử giúp mình nhé.</p>
        <p style="margin:0;line-height:1.4;"><b style="color:#B9BBFA;font-weight:600;">Chi Lê</b> Ok, mình sẽ gửi checklist trước 17:00.</p>
      </div>
    </div>
  </div>
  <!-- Bottom bar -->
  <footer style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 16px 14px;">
    <div style="display:flex;gap:10px;align-items:center;min-width:0;font-size:15.2px;">
      <span style="font-variant-numeric:tabular-nums;">12:34</span>
      <span style="color:#A3A3BC;" aria-hidden="true">|</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">#general</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div style="display:flex;align-items:center;background:#2A2A40;border-radius:999px;">
        <button type="button" aria-label="Audio settings" style="width:30px;height:46px;border:0;background:transparent;color:#EEEEF6;border-radius:999px 0 0 999px;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
        <button type="button" aria-label="Mute" style="width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></button>
      </div>
      <div style="display:flex;align-items:center;background:#2A2A40;border-radius:999px;">
        <button type="button" aria-label="Video settings" style="width:30px;height:46px;border:0;background:transparent;color:#EEEEF6;border-radius:999px 0 0 999px;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
        <button type="button" aria-label="Turn on camera" style="width:46px;height:46px;border:0;border-radius:50%;background:#B8344A;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="m2 2 20 20"/></svg></button>
      </div>
      <button type="button" aria-label="Turn off captions" aria-pressed="true" style="width:46px;height:46px;border:0;border-radius:50%;background:#3A3DB0;color:#C9CAF5;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="14" x="3" y="5" rx="2" ry="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg></button>
      <button type="button" aria-label="Send a reaction" style="width:46px;height:46px;border:0;border-radius:50%;background:#2A2A40;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg></button>
      <button type="button" aria-label="Share screen" style="width:46px;height:46px;border:0;border-radius:50%;background:#2A2A40;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m17 8 5-5"/><path d="M17 3h5v5"/></svg></button>
      <button type="button" aria-label="Raise hand" style="width:46px;height:46px;border:0;border-radius:50%;background:#2A2A40;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
      <button type="button" aria-label="More options" style="width:46px;height:46px;border:0;border-radius:50%;background:#2A2A40;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      <a href="Main.dc.html" aria-label="Leave Meet" style="height:46px;padding:0 22px;box-sizing:border-box;border-radius:999px;background:#B8344A;color:#EEEEF6;display:grid;place-items:center;text-decoration:none;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.1 13.9a14 14 0 0 0 3.732 2.668 1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2 18 18 0 0 1-12.728-5.272"/><path d="M22 2 2 22"/><path d="M4.76 13.582A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 .244.473"/></svg></a>
    </div>
    <div style="display:flex;gap:4px;justify-content:flex-end;">
      <button type="button" aria-label="People" style="position:relative;width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg><span style="position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:#2A2A40;font-size:11px;display:grid;place-items:center;padding:0 4px;box-sizing:border-box;">5</span></button>
      <button type="button" aria-label="Meet chat" style="width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg></button>
      <button type="button" aria-label="Meet tools" style="width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg></button>
      <button type="button" aria-label="Meet details" style="width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:#EEEEF6;display:grid;place-items:center;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    // Tiles: speaking = teal ring, hand = amber ring.
    const people = [
      { name: 'Bob Trần', ini: 'BT', speaking: true, hand: false, muted: false },
      { name: 'Chi Lê', ini: 'CL', speaking: false, hand: false, muted: true },
      { name: 'Dũng Phạm', ini: 'DP', speaking: false, hand: true, muted: false },
      { name: 'Hà Võ', ini: 'HV', speaking: false, hand: false, muted: true },
      { name: 'Alice Nguyễn (you)', ini: 'AN', speaking: false, hand: false, muted: false },
    ];
    const tiles = people.map((p) => ({ ...p, ring: p.speaking ? '#8B8EF5' : p.hand ? '#E8B45C' : 'transparent' }));
    return { vars: common + (dark ? darkT : lightT), tiles };
  }
}
</script>
</body>
</html>
