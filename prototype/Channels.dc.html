<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Directories · Channels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:flex;background:var(--sb);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <div style="width:54px;height:900px;flex:none;">
    <dc-import name="Rail" active="home" hint-size="54px,900px"></dc-import>
  </div>
  <div style="width:280px;height:900px;flex:none;">
    <dc-import name="SidePanel" active="directories" hint-size="280px,900px"></dc-import>
  </div>
  <section style="width:1106px;height:900px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sf);border-left:1px solid var(--ru);border-top-left-radius:10px;overflow:hidden;">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ru);min-height:52px;box-sizing:border-box;">
      <h1 style="margin:0;font-size:17px;font-weight:700;">Directories</h1>
      <a href="Main.dc.html" aria-label="Close" style="width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink);text-decoration:none;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    </header>
    <nav aria-label="Directories" style="display:flex;gap:4px;padding:8px 20px 0;border-bottom:1px solid var(--ru);">
      <a href="People.dc.html" style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;text-decoration:none;">People</a>
      <a href="Channels.dc.html" style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid var(--ac);color:var(--ink);font-weight:600;text-decoration:none;">Channels</a>
      <span style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;">External</span>
      <span style="padding:6px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mu);font-weight:600;">Invitations</span>
    </nav>
    <div style="flex:1;min-height:0;overflow:hidden;">
      <div style="padding:18px 24px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;">
        <div style="display:flex;gap:10px;align-items:center;">
          <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;box-sizing:border-box;border:1px solid var(--ru);border-radius:10px;background:var(--sf);color:var(--mu);"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>Search channels by name or description</div>
          <button type="button" style="height:44px;padding:0 16px;border:0;border-radius:6px;background:var(--ac);color:var(--aci);font:600 15px var(--font);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Create a channel</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          <span style="height:32px;padding:0 12px;border:1px solid var(--ru);border-radius:999px;background:var(--sf);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">Any channel <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          <span style="height:32px;padding:0 12px;border:1px solid var(--ru);border-radius:999px;background:var(--sf);font-size:13px;font-weight:600;display:inline-flex;align-items:center;">Only joined</span>
          <span style="flex:1;"></span>
          <span style="height:32px;padding:0 12px;border-radius:999px;color:var(--mu);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">A to Z <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        </div>
        <p style="margin:0;font-size:13px;color:var(--mu);">6 channels</p>
        <ul style="list-style:none;margin:0;padding:0;border-top:1px solid var(--ru);">
          <sc-for list="{{channels}}" as="c" hint-placeholder-count="6">
            <li style="display:flex;align-items:center;gap:12px;padding:0 10px;border-bottom:1px solid var(--ru);background:{{c.bg}};">
              <a href="Main.dc.html" style="flex:1;min-width:0;display:grid;gap:3px;padding:12px 2px;text-decoration:none;color:var(--ink);">
                <span style="display:flex;align-items:center;gap:4px;min-width:0;font-weight:700;font-size:15px;">
                  <sc-if value="{{c.isPrivate}}" hint-placeholder-val="{{false}}">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  </sc-if>
                  <sc-if value="{{c.isPublic}}" hint-placeholder-val="{{true}}">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--mu)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
                  </sc-if>
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:{{c.titleColor}};">{{c.name}}</span>
                  <sc-if value="{{c.archived}}" hint-placeholder-val="{{false}}">
                    <span style="margin-left:4px;padding:0 6px;border-radius:999px;background:var(--sf2);color:var(--mu);font-size:11px;font-weight:600;">Archived</span>
                  </sc-if>
                </span>
                <span style="display:flex;align-items:center;gap:6px;min-width:0;color:var(--mu);font-size:13px;white-space:nowrap;">
                  <sc-if value="{{c.joined}}" hint-placeholder-val="{{true}}">
                    <span style="display:inline-flex;align-items:center;gap:2px;color:var(--joined);font-weight:600;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Joined</span>
                    <span aria-hidden="true">·</span>
                  </sc-if>
                  <span>{{c.members}}</span>
                  <span aria-hidden="true">·</span>
                  <span style="overflow:hidden;text-overflow:ellipsis;">{{c.desc}}</span>
                </span>
              </a>
              <div style="display:flex;gap:6px;flex:none;opacity:{{c.actions}};">
                <sc-if value="{{c.joined}}" hint-placeholder-val="{{true}}">
                  <button type="button" style="border:1px solid var(--ru);border-radius:6px;min-height:28px;padding:2px 12px;font:600 12.8px var(--font);color:var(--ink);background:none;">Leave</button>
                  <a href="Main.dc.html" style="border:1px solid var(--ru);border-radius:6px;min-height:28px;padding:2px 12px;box-sizing:border-box;font:600 12.8px var(--font);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;">Open</a>
                </sc-if>
              </div>
            </li>
          </sc-for>
        </ul>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    const joinedColor = dark ? "--joined:#5DD3A0;" : "--joined:#1C7C54;";
    const list = [
      { name: 'general', members: '5 members', desc: 'Thông báo chung cho cả nhóm', joined: true, isPrivate: false, archived: false, hover: true },
      { name: 'design', members: '4 members', desc: 'Thiết kế sản phẩm và tài liệu UI', joined: true, isPrivate: false, archived: false, hover: false },
      { name: 'du-an-alpha', members: '3 members', desc: 'Dự án Alpha: kế hoạch, tiến độ, rủi ro', joined: true, isPrivate: true, archived: false, hover: false },
      { name: 'releases', members: '5 members', desc: 'Lịch và ghi chú phát hành', joined: true, isPrivate: false, archived: false, hover: false },
      { name: 'ngoai-gio', members: '2 members', desc: 'Chuyện ngoài lề, cà phê, âm nhạc', joined: false, isPrivate: false, archived: false, hover: false },
      { name: 'du-an-beta', members: '3 members', desc: 'Dự án Beta (đã kết thúc)', joined: false, isPrivate: false, archived: true, hover: false },
    ];
    const channels = list.map((c) => ({
      ...c,
      isPublic: !c.isPrivate,
      bg: c.hover ? 'var(--sf2)' : 'transparent',
      actions: c.hover ? 1 : 0,
      titleColor: c.archived ? 'var(--mu)' : 'var(--ink)',
    }));
    return { vars: common + joinedColor + (dark ? darkT : lightT), channels };
  }
}
</script>
</body>
</html>
