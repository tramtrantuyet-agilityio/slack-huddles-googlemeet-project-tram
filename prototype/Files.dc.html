<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:flex;background:var(--sb);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <div style="width:54px;height:900px;flex:none;">
    <dc-import name="Rail" active="files" hint-size="54px,900px"></dc-import>
  </div>
  <aside aria-label="Files" style="width:280px;height:900px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sb);color:var(--sb-ink);">
    <header style="display:flex;align-items:center;gap:6px;padding:14px 12px 10px 16px;">
      <h2 style="margin:0;font-size:17px;font-weight:700;color:var(--sb-strong);flex:1;">Files</h2>
    </header>
    <nav aria-label="Files" style="display:grid;padding:0 8px 2px;">
      <a href="Files.dc.html" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;font-size:14px;line-height:1.2;text-decoration:none;background:var(--sb-active);color:#fff;font-weight:600;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>All files</a>
      <a href="Files.dc.html" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;font-size:14px;line-height:1.2;text-decoration:none;color:var(--sb-ink);opacity:.9;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My files</a>
    </nav>
    <section style="padding:8px 0;">
      <div style="padding:0 16px;height:28px;display:flex;align-items:center;"><h3 style="margin:0;font-size:14px;font-weight:500;">Starred</h3></div>
      <p style="margin:0;padding:8px 16px;font-size:13px;color:var(--sb-ink);opacity:.85;">Star a file to keep it here. Stars stay on this device.</p>
    </section>
  </aside>
  <section style="width:1106px;height:900px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sf);border-left:1px solid var(--ru);border-top-left-radius:10px;overflow:hidden;">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ru);min-height:52px;box-sizing:border-box;">
      <h1 style="margin:0;font-size:17px;font-weight:700;">All files</h1>
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="position:relative;display:flex;align-items:center;width:200px;padding:5px 10px 5px 30px;box-sizing:border-box;border-radius:8px;border:1px solid var(--ru);background:var(--sf2);color:var(--mu);font-size:14px;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;left:8px;"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>Search files by name</div>
        <a href="Main.dc.html" aria-label="Close" style="width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink);text-decoration:none;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
      </div>
    </header>
    <ul style="list-style:none;margin:0;padding:4px 0;flex:1;min-height:0;overflow:hidden;">
      <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
        <li style="display:flex;align-items:center;border-bottom:1px solid var(--ru);">
          <a href="Main.dc.html" style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 20px;text-decoration:none;color:var(--ink);">
            <span style="width:40px;height:40px;flex:none;border-radius:6px;display:grid;place-items:center;color:var(--mu);background:var(--sf2);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span>
            <span style="display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-size:12px;color:var(--mu);">
              <span style="font-weight:700;color:var(--ink);font-size:14px;">{{f.name}}</span>
              <span>{{f.note}}</span>
              <span>{{f.who}}</span>
              <time>{{f.time}}</time>
            </span>
          </a>
          <div style="display:flex;gap:6px;padding:0 20px;align-items:center;">
            <button type="button" aria-label="Star file" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--mu);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></button>
            <a href="Main.dc.html" style="border:1px solid var(--ru);border-radius:6px;padding:3px 10px;min-height:28px;box-sizing:border-box;font:600 13px var(--font);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;">In {{f.place}}</a>
          </div>
        </li>
      </sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    const files = [
      { name: 'release-checklist.pdf', note: '248 KB', who: 'Bob Trần', time: 'Yesterday 16:40', place: '#releases' },
      { name: 'wireframe-v3.png', note: '1.2 MB', who: 'Hà Võ', time: 'Yesterday 11:02', place: '#design' },
      { name: 'ke-hoach-tuan-22.xlsx', note: '86 KB', who: 'Chi Lê', time: 'Mon 09:15', place: '#du-an-alpha' },
      { name: 'demo-phat-hanh.mp4', note: 'This video is no longer available', who: 'Dũng Phạm', time: 'Oct 28', place: '#releases' },
      { name: 'ghi-chu-hop.md', note: '4 KB', who: 'Alice Nguyễn', time: 'Oct 27', place: '#general' },
    ];
    return { vars: common + (dark ? darkT : lightT), files };
  }
}
</script>
</body>
</html>
