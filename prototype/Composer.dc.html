<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Toki's message composer: formatting toolbar, editor, action row with a split Send (resting state). -->
<div style="width:{{width}};box-sizing:border-box;border:1px solid var(--ru,#2D2D42);border-radius:10px;background:var(--sf,#1B1B29);color:var(--ink,#E9E9F6);font-family:var(--font,'Inter','Segoe UI',system-ui,sans-serif);font-size:15px;line-height:1.45;">
  <div style="display:flex;align-items:center;gap:1px;padding:4px 6px 0;color:var(--mu,#9A9AB5);opacity:.5;" role="toolbar" aria-label="Formatting">
    <button type="button" aria-label="Bold (Ctrl+B)" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h9a4 4 0 010 8H7a1 1 0 01-1-1V5a1 1 0 011-1h7a4 4 0 010 8"/></svg></button>
    <button type="button" aria-label="Italic (Ctrl+I)" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></svg></button>
    <button type="button" aria-label="Strikethrough (Ctrl+Shift+X)" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg></button>
    <span style="width:1px;align-self:stretch;background:var(--ru,#2D2D42);margin:2px 4px;"></span>
    <button type="button" aria-label="Link" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
    <button type="button" aria-label="Numbered list" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></svg></button>
    <button type="button" aria-label="Bulleted list" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg></button>
    <span style="width:1px;align-self:stretch;background:var(--ru,#2D2D42);margin:2px 4px;"></span>
    <button type="button" aria-label="Quote" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/></svg></button>
    <button type="button" aria-label="Code" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></button>
    <button type="button" aria-label="Code block" style="width:28px;height:28px;border:0;border-radius:6px;background:none;color:inherit;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 9-3 3 3 3"/><path d="m14 15 3-3-3-3"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
  </div>
  <div style="padding:8px 12px 6px;min-height:22px;color:var(--mu,#9A9AB5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ph}}</div>
  <div style="display:flex;align-items:center;gap:6px;padding:2px 6px 6px;">
    <div style="display:flex;align-items:center;gap:2px;margin-right:auto;color:var(--mu,#9A9AB5);">
      <button type="button" aria-label="Attach files" style="width:28px;height:28px;border:0;border-radius:50%;background:var(--sf2,#22223A);color:var(--mu,#9A9AB5);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button type="button" aria-label="Show formatting" style="width:28px;height:28px;border:0;background:none;color:var(--mu,#9A9AB5);font:600 14px var(--font,'Inter',sans-serif);letter-spacing:-.02em;">Aa</button>
      <button type="button" aria-label="Emoji" style="width:28px;height:28px;border:0;background:none;color:var(--mu,#9A9AB5);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg></button>
      <button type="button" aria-label="Mention someone" style="width:28px;height:28px;border:0;background:none;color:var(--mu,#9A9AB5);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></button>
      <button type="button" aria-label="Run a command" style="width:28px;height:28px;border:0;background:none;color:var(--mu,#9A9AB5);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="9" x2="15" y1="15" y2="9"/></svg></button>
    </div>
    <div style="display:flex;align-items:stretch;height:30px;border-radius:7px;background:var(--sf2,#22223A);color:var(--mu,#9A9AB5);">
      <button type="button" aria-label="Send" style="border:0;background:none;color:inherit;padding:0 10px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
      <span style="width:1px;margin:6px 0;background:currentColor;opacity:.35;"></span>
      <button type="button" aria-label="Schedule for later" style="border:0;background:none;color:inherit;width:26px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ph":{"editor":null,"default":"Message #general"},"w":{"editor":null,"default":"700"},"$preview":{"width":700,"height":106}}'>
class Component extends DCLogic {
  renderVals() {
    return { ph: this.props.ph ?? 'Message #general', width: (this.props.w ?? '700') + 'px' };
  }
}
</script>
</body>
</html>
