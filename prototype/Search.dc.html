<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:flex;background:var(--sb);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <div style="width:54px;height:900px;flex:none;">
    <dc-import name="Rail" active="home" hint-size="54px,900px"></dc-import>
  </div>
  <div style="width:280px;height:900px;flex:none;">
    <dc-import name="SidePanel" active="general" hint-size="280px,900px"></dc-import>
  </div>
  <div style="width:706px;height:900px;flex:none;">
    <dc-import name="Channel" w="706" compact="yes" query="phát hành" hint-size="706px,900px"></dc-import>
  </div>
  <!-- Search side panel -->
  <aside aria-label="Search results" style="width:400px;height:900px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sf);border-left:1px solid var(--ru);">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ru);min-height:52px;box-sizing:border-box;">
      <h1 style="margin:0;font-size:17px;font-weight:700;">Search results</h1>
      <a href="Main.dc.html" aria-label="Close" style="width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink);text-decoration:none;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
    </header>
    <nav aria-label="Search" style="display:flex;align-items:center;gap:4px;padding:8px 20px 0;border-bottom:1px solid var(--ru);">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.pick}}" style="padding:6px 12px;border:0;border-bottom:2px solid {{t.line}};background:none;color:{{t.color}};font:600 15px var(--font);cursor:pointer;white-space:nowrap;">{{t.label}}</button>
      </sc-for>
    </nav>
    <label style="display:flex;align-items:center;gap:8px;padding:8px 20px 0;font-size:13px;font-weight:500;color:var(--mu);"><input type="checkbox" style="margin:0;accent-color:var(--ac);">Newest first</label>
    <div style="flex:1;min-height:0;overflow:hidden;">
      <sc-if value="{{isMessages}}" hint-placeholder-val="{{true}}">
        <ul style="list-style:none;margin:0;padding:4px 0;">
          <sc-for list="{{hits}}" as="h" hint-placeholder-count="3">
            <li>
              <a href="Main.dc.html" style="display:grid;gap:4px;padding:10px 20px;text-decoration:none;color:var(--ink);">
                <span style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mu);">
                  <span style="width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;background:{{h.avatar}};" aria-hidden="true">{{h.ini}}</span>
                  <span style="font-weight:700;color:var(--ink);font-size:14px;">{{h.name}}</span>
                  <span>{{h.place}}</span>
                  <time>{{h.time}}</time>
                </span>
                <span style="white-space:pre-wrap;overflow-wrap:anywhere;"><sc-for list="{{h.parts}}" as="s" hint-placeholder-count="3"><span style="background:{{s.bg}};color:inherit;border-radius:3px;padding:0 1px;">{{s.t}}</span></sc-for></span>
              </a>
            </li>
          </sc-for>
        </ul>
      </sc-if>
      <sc-if value="{{isPeople}}" hint-placeholder-val="{{false}}">
        <ul style="list-style:none;margin:0;padding:4px 0;">
          <li style="padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);"><span style="width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;background:hsl(22 45% 42%);" aria-hidden="true">DP</span><span style="font-weight:700;color:var(--ink);font-size:14px;">Dũng Phạm</span><span>DevOps Engineer</span></li>
        </ul>
      </sc-if>
      <sc-if value="{{isChannels}}" hint-placeholder-val="{{false}}">
        <ul style="list-style:none;margin:0;padding:4px 0;">
          <li style="padding:10px 20px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu);"><span style="font-weight:700;color:var(--ink);font-size:14px;">#releases</span><span>Lịch và ghi chú phát hành</span></li>
          <li style="padding:0 20px 10px;"><a href="Channels.dc.html" style="color:var(--ac);font-weight:600;text-decoration:none;">Browse channels</a></li>
        </ul>
      </sc-if>
      <sc-if value="{{isFiles}}" hint-placeholder-val="{{false}}">
        <ul style="list-style:none;margin:0;padding:4px 0;">
          <li style="padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mu);"><span style="font-weight:700;color:var(--ink);font-size:14px;">release-checklist.pdf</span><time>Yesterday 16:40</time></li>
        </ul>
      </sc-if>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    const cur = (this.state && this.state.tab) || 'messages';
    const defs = [['messages', 'Messages'], ['people', 'People'], ['channels', 'Channels'], ['files', 'Files']];
    const tabs = defs.map(([id, label]) => ({
      label,
      pick: () => this.setState({ tab: id }),
      line: cur === id ? 'var(--ac)' : 'transparent',
      color: cur === id ? 'var(--ink)' : 'var(--mu)',
    }));
    // Search hits: parts with hl = true are the highlighted match (mark).
    const hl = 'var(--men)';
    const hits = [
      { name: 'Bob Trần', ini: 'BT', hue: 215, place: '#general', time: 'Yesterday 16:42', parts: [['Quy trình ', 0], ['phát hành', 1], [': kiểm thử → duyệt → ', 0], ['phát hành', 1]] },
      { name: 'Dũng Phạm', ini: 'DP', hue: 22, place: '#releases', time: 'Yesterday 14:05', parts: [['Bản ', 0], ['phát hành', 1], [' 1.4 sẽ deploy tối nay', 0]] },
      { name: 'Chi Lê', ini: 'CL', hue: 335, place: '#du-an-alpha', time: 'Mon 09:30', parts: [['Lịch ', 0], ['phát hành', 1], [' tuần sau cần chốt trước thứ Năm', 0]] },
    ].map((h) => ({ ...h, avatar: 'hsl(' + h.hue + ' 45% 42%)', parts: h.parts.map(([t, m]) => ({ t, bg: m ? hl : 'transparent' })) }));
    return { vars: common + (dark ? darkT : lightT), tabs, hits, isMessages: cur === 'messages', isPeople: cur === 'people', isChannels: cur === 'channels', isFiles: cur === 'files' };
  }
}
</script>
</body>
</html>
