<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <main style="width:380px;box-sizing:border-box;background:var(--sf);border:1px solid var(--ru);border-radius:14px;padding:32px 28px;display:grid;gap:18px;text-align:left;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:36px;height:36px;border-radius:10px;background:var(--ac);color:var(--aci);display:grid;place-items:center;font-weight:800;font-size:20px;" aria-hidden="true">t</span>
      <span style="font-weight:800;font-size:22px;letter-spacing:-.02em;">toki</span>
    </div>
    <h1 style="margin:0;font-size:20px;font-weight:700;">Sign in to your company's Toki</h1>
    <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:7px 14px;box-sizing:border-box;border-radius:6px;background:var(--ac);color:var(--aci);font-weight:600;text-decoration:none;width:100%;">Sign in with company account</a>
    <section aria-labelledby="personas-title" style="display:grid;gap:8px;">
      <h2 id="personas-title" style="margin:0;font-size:13px;font-weight:600;color:var(--mu);">Sign in as a test person</h2>
      <ul style="list-style:none;margin:0;padding:0;display:grid;gap:6px;">
        <sc-for list="{{personas}}" as="p" hint-placeholder-count="3">
          <li>
            <a href="Main.dc.html" style="width:100%;box-sizing:border-box;display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ru);border-radius:8px;background:var(--sf);color:var(--ink);text-decoration:none;">
              <span style="width:32px;height:32px;border-radius:8px;background:var(--ac);color:var(--aci);display:grid;place-items:center;font-weight:700;" aria-hidden="true">{{p.initial}}</span>
              <span style="display:grid;min-width:0;"><span style="font-weight:600;">{{p.name}}</span><span style="font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{p.title}}</span></span>
              <span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mu);border:1px solid var(--ru);">{{p.role}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
    <form style="display:grid;gap:12px;">
      <p style="margin:0;font-size:13px;color:var(--mu);">Or sign in with any email address.</p>
      <label style="display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mu);">Email<input type="email" style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid var(--ru);background:var(--sf);color:var(--ink);font:15px var(--font);"></label>
      <label style="display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mu);">Display name<input type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid var(--ru);background:var(--sf);color:var(--ink);font:15px var(--font);"></label>
      <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:34px;padding:7px 14px;box-sizing:border-box;border-radius:6px;background:var(--ac);color:var(--aci);font-weight:600;text-decoration:none;width:100%;">Continue</a>
    </form>
    <label style="display:flex;align-items:center;justify-content:flex-end;gap:8px;font-weight:500;font-size:13px;color:var(--mu);">Language<select style="width:auto;padding:6px 10px;border-radius:6px;border:1px solid var(--ru);background:var(--sf);color:var(--ink);font:14px var(--font);"><option>English</option></select></label>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    const personas = [
      { name: 'Alice Nguyễn', initial: 'A', title: 'Product Manager', role: 'Owner' },
      { name: 'Bob Trần', initial: 'B', title: 'Backend Engineer', role: 'Member' },
      { name: 'Dũng Phạm', initial: 'D', title: 'DevOps Engineer', role: 'Admin' },
    ];
    return { vars: common + (dark ? darkT : lightT), personas };
  }
}
</script>
</body>
</html>
