<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toki · Thread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}width:1440px;height:900px;position:relative;overflow:hidden;display:flex;background:var(--sb);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;">
  <div style="width:54px;height:900px;flex:none;">
    <dc-import name="Rail" active="home" hint-size="54px,900px"></dc-import>
  </div>
  <div style="width:280px;height:900px;flex:none;">
    <dc-import name="SidePanel" active="general" hint-size="280px,900px"></dc-import>
  </div>
  <div style="width:706px;height:900px;flex:none;">
    <dc-import name="Channel" w="706" compact="yes" hint-size="706px,900px"></dc-import>
  </div>
  <!-- Thread pane -->
  <aside aria-label="Thread" style="width:400px;height:900px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sf);border-left:1px solid var(--ru);">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ru);min-height:52px;box-sizing:border-box;">
      <h1 style="margin:0;font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:6px;">Thread <span style="font-weight:400;color:var(--mu);font-size:13px;">#general</span></h1>
      <div style="display:flex;align-items:center;gap:6px;">
        <button type="button" style="border:1px solid var(--ru);border-radius:6px;padding:2px 10px;min-height:28px;font:600 13px var(--font);color:var(--ink);background:none;cursor:pointer;">Unfollow</button>
        <a href="Main.dc.html" aria-label="Close" style="width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink);text-decoration:none;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
      </div>
    </header>
    <div style="flex:1;min-height:0;overflow:hidden;padding:8px 0 12px;display:flex;flex-direction:column;justify-content:flex-end;">
      <!-- root -->
      <div style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 20px 4px;">
        <span style="width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:hsl(22 45% 42%);margin-top:2px;" aria-hidden="true">DP</span>
        <div>
          <div style="display:flex;align-items:baseline;gap:8px;"><span style="font-weight:700;">Dũng Phạm</span><time style="font-size:12px;color:var(--mu);">09:12</time></div>
          <div>Họp lúc 14:00 nhé?</div>
        </div>
      </div>
      <!-- replies divider -->
      <div style="display:flex;align-items:center;gap:10px;margin:12px 20px 4px;font-size:12px;font-weight:700;color:var(--mu);">
        <span style="flex:1;height:1px;background:var(--ru);"></span>3 replies<span style="flex:1;height:1px;background:var(--ru);"></span>
      </div>
      <div style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 20px 4px;">
        <span style="width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:hsl(262 45% 42%);margin-top:2px;" aria-hidden="true">AN</span>
        <div>
          <div style="display:flex;align-items:baseline;gap:8px;"><span style="font-weight:700;">Alice Nguyễn</span><time style="font-size:12px;color:var(--mu);">09:15</time></div>
          <div>Được, mình tham gia.</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 20px 4px;">
        <span style="width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:hsl(215 45% 42%);margin-top:2px;" aria-hidden="true">BT</span>
        <div>
          <div style="display:flex;align-items:baseline;gap:8px;"><span style="font-weight:700;">Bob Trần</span><time style="font-size:12px;color:var(--mu);">09:20</time></div>
          <div>OK, dời sang 14:30 có tiện không? Mình có buổi review lúc 13:30.</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 20px 4px;">
        <span style="width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:hsl(335 45% 42%);margin-top:2px;" aria-hidden="true">CL</span>
        <div>
          <div style="display:flex;align-items:baseline;gap:8px;"><span style="font-weight:700;">Chi Lê</span><time style="font-size:12px;color:var(--mu);">09:40</time></div>
          <div>14:30 ổn, mình sẽ gửi lại lịch nhé.</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
            <span style="display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:12px;border:1px solid var(--ac);background:var(--acs);font-size:13px;">👍 <b style="font-weight:600;">2</b></span>
          </div>
        </div>
      </div>
    </div>
    <!-- reply composer -->
    <div style="margin:0 20px 6px;border:1px solid var(--ru);border-radius:10px;background:var(--sf);">
      <div style="display:flex;align-items:center;gap:1px;padding:4px 6px 0;color:var(--mu);opacity:.5;">
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h9a4 4 0 010 8H7a1 1 0 01-1-1V5a1 1 0 011-1h7a4 4 0 010 8"/></svg></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></svg></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg></span>
        <span style="width:1px;align-self:stretch;background:var(--ru);margin:2px 4px;"></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></svg></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg></span>
        <span style="width:1px;align-self:stretch;background:var(--ru);margin:2px 4px;"></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>
        <span style="width:28px;height:28px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 9-3 3 3 3"/><path d="m14 15 3-3-3-3"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg></span>
      </div>
      <div style="padding:8px 12px 6px;min-height:22px;color:var(--mu);">Reply…</div>
      <div style="display:flex;align-items:center;gap:6px;padding:2px 6px 6px;">
        <div style="display:flex;align-items:center;gap:2px;margin-right:auto;color:var(--mu);">
          <button type="button" aria-label="Attach files" style="width:28px;height:28px;border:0;border-radius:50%;background:var(--sf2);color:var(--mu);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          <button type="button" aria-label="Show formatting" style="width:28px;height:28px;border:0;background:none;color:var(--mu);font:600 14px var(--font);letter-spacing:-.02em;">Aa</button>
          <button type="button" aria-label="Emoji" style="width:28px;height:28px;border:0;background:none;color:var(--mu);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg></button>
          <button type="button" aria-label="Mention someone" style="width:28px;height:28px;border:0;background:none;color:var(--mu);display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></button>
        </div>
        <div style="display:flex;align-items:stretch;height:30px;border-radius:7px;background:var(--sf2);color:var(--mu);">
          <button type="button" aria-label="Send" style="border:0;background:none;color:inherit;padding:0 10px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
          <span style="width:1px;margin:6px 0;background:currentColor;opacity:.35;"></span>
          <button type="button" aria-label="Schedule for later" style="border:0;background:none;color:inherit;width:26px;display:inline-grid;place-items:center;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin:0 20px 14px;font-size:13px;font-weight:500;color:var(--mu);"><input type="checkbox" style="margin:0;accent-color:var(--ac);">Also send to channel</label>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const common = "--rail-ink:#D9DAF0;--sb-ink:#C9CAE6;--sb-strong:#ffffff;--sb-active:#4B4FD8;--badge:#E11D48;--focus:#6B6EF0;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;--mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;";
    const darkT = "--bg:#12121C;--sf:#1B1B29;--sf2:#22223A;--rail:#0E0E18;--sb:#161622;--sbh:#22223A;--ink:#E9E9F6;--mu:#9A9AB5;--ru:#2D2D42;--ac:#8B8EF5;--aci:#12122A;--acs:#25264A;--men:#443214;--meni:#F0C47A;--dg:#F08196;";
    const lightT = "--bg:#F5F5FA;--sf:#ffffff;--sf2:#EEEEF6;--rail:#1B1B2F;--sb:#232340;--sbh:#2E2E52;--ink:#1B1B2F;--mu:#66667F;--ru:#E2E2EE;--ac:#4B4FD8;--aci:#ffffff;--acs:#E9E9FC;--men:#FBEFD5;--meni:#9A6212;--dg:#B8344A;";
    return { vars: common + (dark ? darkT : lightT) };
  }
}
</script>
</body>
</html>
